<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brain Unstressor Device</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="device-container">
        <div class="device-header">
            <h1>BRAIN UNSTRESSOR</h1>
            <div class="status-light"></div>
        </div>
        <canvas id="interactive-canvas"></canvas>
        <div class="device-footer">
            <button id="audio-toggle" title="Toggle Sound">
                <svg id="volume-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                <svg id="mute-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="1" x2="1" y2="23"></line></svg>
            </button>
            <div id="shape-controls" class="shape-controls">
                <!-- Shape buttons will be added here by script.js -->
            </div>
            <div class="particle-controls">
                <button id="remove-particle" title="Remove Particles">-</button>
                <span id="particle-count">0</span>
                <button id="add-particle" title="Add Particles">+</button>
            </div>
            <span class="status-text">SYSTEM STATUS: <span id="status-value" class="status-value">NOMINAL</span></span>
        </div>
    </div>
    <div id="notification" class="notification"></div>
    <div class="discovered-shapes-container">
        <h2>Discovered Shapes</h2>
        <div id="discovered-shapes-gallery"></div>
    </div>
    <audio id="ambient-audio" src="ambient-sound.mp3" loop></audio>
    <script src="script.js"></script>

</body>
</html>
